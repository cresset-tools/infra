[package]
name = "cresset-view"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
jj-lib = { git = "https://github.com/jj-vcs/jj", rev = "89f62ede8c1c611eaf134c0c49252efd65c7945d" }
pollster = "0.4"
# The cresset-sync checkpoint database is read read-only to surface synchronization state.
# Bundled so this owns its SQLite version and needs no system library, matching cresset-sync.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"
