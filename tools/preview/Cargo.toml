[package]
name = "preview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Preview environments on mageos-testing: the host CLI and daemon, and the guest agent"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "fs", "io-util"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
toml = "0.9"
vsock = "0.5"

[[bin]]
name = "preview"
path = "src/bin/preview.rs"

[[bin]]
name = "preview-agent"
path = "src/bin/preview-agent.rs"

[profile.release]
strip = true
